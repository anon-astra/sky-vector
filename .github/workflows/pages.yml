name: Publish Skyvector and refresh observations
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Fetch aircraft and METAR observations
        run: node scripts/fetch-data.mjs
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public live proxy
        if: github.event_name != 'schedule'
        run: |
          node --input-type=module <<'JS'
          for (const url of ['https://api.adsb.lol/v2/point/40.6413/-73.7781/80','https://opensky-network.org/api/states/all?lamin=39.94&lamax=41.34&lomin=-74.78&lomax=-72.78']) {
            try { const r=await fetch(url,{headers:{Origin:'https://anon-astra.github.io'},signal:AbortSignal.timeout(25000)});const d=await r.json();console.log(JSON.stringify({url,status:r.status,cors:r.headers.get('access-control-allow-origin'),now:d.now,time:d.time,count:d.ac?.length??d.states?.length,sample:d.ac?.[0]})); } catch(e){console.log(url,e.message);}
          }
          JS
