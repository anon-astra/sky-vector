name: Publish Skyvector and refresh observations
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Fetch aircraft and METAR observations
        run: node scripts/fetch-data.mjs
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public live proxy
        if: github.event_name != 'schedule'
        run: |
          node --input-type=module <<'JS'
          for (const host of ['api.adsb.lol','api.airplanes.live']) {
            try {
              const r = await fetch('https://'+host+'/v2/point/40.6413/-73.7781/80',{headers:{'User-Agent':'Skyvector/1.0 (+https://github.com/anon-astra/sky-vector)',Origin:'https://anon-astra.github.io'},signal:AbortSignal.timeout(15000)});
              const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}
              console.log(JSON.stringify({host,status:r.status,cors:r.headers.get('access-control-allow-origin'),count:d.ac?.length,now:d.now,error:r.ok?null:text.slice(0,300)}));
            } catch(e){console.log(host,e.message)}
          }
          const r = await fetch('https://skyvector-airspace.anon69f.chatgpt.site/api/live?hub=JFK', {
            headers: { Origin: 'https://anon-astra.github.io' },
            signal: AbortSignal.timeout(25000)
          });
          if (!r.ok) throw Error('Proxy HTTP ' + r.status);
          if (r.headers.get('access-control-allow-origin') !== 'https://anon-astra.github.io') throw Error('Missing CORS permission');
          const d = await r.json();
          console.log(JSON.stringify({ hub: d.hub, aircraftSource: d.aircraftSource, weatherSource: d.weatherSource, aircraftCount: d.flights?.length, observationAgeSeconds: (Date.now()-d.aircraftObservedAt)/1000, issues: d.issues }));
          if (d.aircraftSource !== 'live' || Date.now()-d.aircraftObservedAt > 180000) throw Error('Live aircraft source unavailable or stale');
          JS
